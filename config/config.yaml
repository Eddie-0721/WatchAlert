Server:
  port: "9001"
  # release / debug / test
  mode: "release"

# Optional per-process evaluation limits. Applies to active alert/recording
# queries; no backlog of missed ticks is replayed after a slow evaluation.
Evaluation:
  # Enable only after every backend writer runs a rule-index-aware version.
  # On first read after restart the derived index is rebuilt from source data.
  ruleEventIndex: false
  maxConcurrentQueries: 32
  maxDatasourcesPerRule: 4

Probing:
  # Shared by scheduled cycles (including writes) and interactive probes.
  # Per process; requires restart after changing.
  maxConcurrentRuns: 32

Database:
  # 数据库类型: mysql 或 sqlite (默认: mysql)
  type: mysql
  # MySQL 配置 (当 type 为 mysql 时使用)
  host: w8t-mysql
  port: 3306
  user: root
  pass: w8t.123
  dbName: watchalert
  timeout: 10s
  # Optional MySQL pool settings (defaults shown; limits are per process).
  # Leave commented when using SQLite, which retains a single connection.
  # maxOpenConns: 32
  # maxIdleConns: 8
  # connMaxLifetimeSeconds: 1800
  # connMaxIdleTimeSeconds: 300
  # SQLite 配置 (当 type 为 sqlite 时使用)
  path: data/w8t.db

Redis:
  host: w8t-redis
  port: 6379
  pass: ""
  database: 0

Jwt:
  # 失效时间
  expire: 18000

# Copilot Agent 服务仅接受内网调用。请在生产环境通过 Secret 注入
# internalToken，切勿将真实值提交到 Git。
Agent:
  url: ""
  internalToken: ""
  # 用于加密页面保存的模型 API Key。生产环境请通过 Secret 注入强随机值；
  # 丢失后已有 API Key 无法解密。
  credentialKey: ""
  timeout: 60
