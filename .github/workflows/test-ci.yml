name: Backend and Agent checks
on:
  push:
    branches: [eddie, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/watchalert ./cmd/main.go
      # Include notification/probe/client/config regressions. Do not use
      # ./pkg/provider/...: its test subpackage contains external-service demos.
      - run: go test ./config ./cmd ./api/... ./internal/... ./alert/... ./pkg/client ./pkg/provider ./pkg/aws/cloudwatch ./pkg/tools ./pkg/medium/... ./pkg/agenttoken ./pkg/secretbox ./pkg/oidc -count=1 -timeout 120s
      # This remains a legacy compatibility check until R0.4 migrates the
      # reference. The independent WatchAlert-agent repository owns its CI.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r agent-service/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: agent-service
