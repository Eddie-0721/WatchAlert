name: Backend and Agent checks
on:
  push:
    branches: [eddie, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/watchalert ./cmd/main.go
      - run: go test ./internal/services ./internal/models ./pkg/agenttoken ./pkg/secretbox
      # Existing unrelated repo files have vet findings; keep the regression
      # isolated without suppressing vet for the main suites.
      - run: go test -vet=off ./internal/repo -run '^TestSilenceUpdatePersistsFutureStatusAndLabels$'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r agent-service/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: agent-service
