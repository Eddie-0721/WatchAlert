name: Backend and Agent checks
on:
  push:
    branches: [eddie, 'codex/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/watchalert ./cmd/main.go
      - run: go test ./api ./internal/middleware ./internal/repo ./internal/services ./internal/models ./internal/cache ./alert/eval ./pkg/provider ./pkg/aws/cloudwatch ./pkg/tools ./pkg/agenttoken ./pkg/secretbox ./pkg/oidc
      # This remains a legacy compatibility check until R0.4 migrates the
      # reference. The independent WatchAlert-agent repository owns its CI.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r agent-service/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: agent-service
